<!--
    Practical - 6: CivicGrid — Area-Wise Task Manager + Kanban Board + Tailwind CSS
    Description: Demonstrates Tailwind CSS utility-first styling applied across the full HTML web application,
                 integrating Geolocation, Local Storage, and Drag and Drop APIs.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicGrid - Area-Wise Task Manager (Tailwind CSS)</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }

        .btn-location.detecting .pulse-dot {
            background: #f97316;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(1.5); }
        }

        /* Leaflet map popup overrides */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            padding: 4px;
        }
    </style>
</head>
<body class="bg-amber-50/40 min-h-screen text-slate-800 antialiased p-4 sm:p-8 flex justify-center">

    <div class="w-full max-w-5xl bg-white rounded-3xl border border-slate-200 p-6 sm:p-10 shadow-xl space-y-8">
        
        <!-- Top Navigation Bar -->
        <header class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-500 text-white font-black text-xl flex items-center justify-center shadow-md shadow-brand-500/30">
                    C
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-900 tracking-tight">CivicGrid</h2>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-brand-100 text-brand-700">
                        Practical 6 • Tailwind CSS
                    </span>
                </div>
            </div>
            
            <nav class="flex items-center gap-3">
                <a href="tailwind_demo.html" class="px-3.5 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold hover:bg-slate-200 transition">
                    ⚡ Tailwind Showcase
                </a>
            </nav>
        </header>

        <!-- Responsive Banner -->
        <picture class="block rounded-2xl overflow-hidden shadow-sm border border-slate-200">
            <source media="(max-width: 600px)" srcset="https://via.placeholder.com/600x250/f97316/FFFFFF?text=CivicGrid+Mobile">
            <img src="https://via.placeholder.com/1200x350/f97316/FFFFFF?text=CivicGrid+Desktop" alt="CivicGrid Banner" class="w-full h-auto object-cover max-h-56">
        </picture>

        <!-- Title Header -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-brand-600 tracking-tight">CivicGrid</h1>
            <p class="text-sm sm:text-base text-slate-500 font-medium">Area-Wise Task Management for Civic Authorities</p>
        </div>

        <!-- User Session Header -->
        <div id="userHeader" class="flex flex-wrap items-center justify-between gap-3 p-4 bg-orange-50/80 rounded-2xl border border-orange-200 text-sm">
            <span id="welcomeMessage" class="font-bold text-brand-700">Welcome!</span>
            <button onclick="signOut()" class="px-4 py-2 text-xs font-bold rounded-xl bg-red-600 text-white hover:bg-red-700 transition active:scale-95 shadow-sm">
                Sign Out
            </button>
        </div>

        <!-- I. Geolocation API — Location Bar -->
        <div class="flex justify-center">
            <button class="btn-location inline-flex items-center gap-2.5 px-5 py-2.5 rounded-full bg-orange-50 border border-orange-300 text-xs sm:text-sm font-semibold text-brand-700 hover:bg-orange-100 transition shadow-sm hover:shadow active:scale-95" id="locationBtn" onclick="detectLocation()">
                <span class="pulse-dot"></span>
                <span id="locationText">📍 Detect My Location</span>
            </button>
        </div>

        <!-- Interactive Leaflet Map Container -->
        <div class="rounded-2xl overflow-hidden border border-slate-200 shadow-md relative bg-slate-50">
            <div id="map" class="h-80 w-full z-10"></div>
        </div>

        <!-- View Toggle (List ↔ Kanban Board) -->
        <div class="flex justify-center">
            <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200 text-xs sm:text-sm font-semibold">
                <button id="btnListView" class="px-5 py-2 rounded-lg transition-all duration-200 active font-semibold" onclick="switchView('list')">
                    📋 List View
                </button>
                <button id="btnKanbanView" class="px-5 py-2 rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900" onclick="switchView('kanban')">
                    🗂️ Kanban Board
                </button>
            </div>
        </div>

        <!-- Input Section (Form Controls built with Tailwind) -->
        <div class="bg-orange-50/70 p-6 rounded-2xl border border-orange-200 space-y-5">
            <div>
                <h3 class="text-sm font-bold text-brand-700 uppercase tracking-wider mb-3">Reporter Details</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <input type="text" id="reporterName" placeholder="Your Name" required
                        class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                    <input type="text" id="reporterAadhar" placeholder="Aadhar Card No." required
                        class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                    <input type="number" id="reporterAge" placeholder="Age" min="1" required
                        class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                    <select id="reporterGender" required
                        class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                        <option value="" disabled selected>Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="mt-3">
                    <input type="text" id="reporterResidence" placeholder="Residence Address" required
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                </div>
            </div>

            <div class="pt-2 border-t border-orange-200/60">
                <h3 class="text-sm font-bold text-brand-700 uppercase tracking-wider mb-3">Issue Details</h3>
                <div class="space-y-3">
                    <input type="text" id="taskInput" placeholder="Describe the civic issue (e.g., Pothole repair needed)..." required
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <select id="areaInput" required
                            class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                            <option value="" disabled selected>Select Area</option>
                            <option value="North Zone">North Zone</option>
                            <option value="South Zone">South Zone</option>
                            <option value="East Zone">East Zone</option>
                            <option value="West Zone">West Zone</option>
                            <option value="Downtown">Downtown</option>
                        </select>
                        
                        <input type="file" id="imageInput" accept="image/*"
                            class="px-3 py-1.5 rounded-xl border border-slate-300 text-xs text-slate-500 bg-white file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-orange-100 file:text-brand-700 hover:file:bg-orange-200">
                        
                        <button onclick="addTask()"
                            class="py-2.5 px-5 rounded-xl bg-brand-500 text-white font-bold text-sm shadow-md shadow-brand-500/20 hover:bg-brand-600 transition active:scale-95">
                            Submit Complaint
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- LIST VIEW Container -->
        <div id="listView">
            <div id="tasksContainer" class="space-y-6">
                <!-- Tasks grouped by area injected here -->
            </div>
        </div>

        <!-- III. Drag and Drop API — KANBAN VIEW Container -->
        <div id="kanbanView" style="display: none;">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 min-h-[350px]" id="kanbanBoard">
                <!-- 3 columns injected by app.js -->
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-white border border-slate-200 border-l-4 border-l-brand-500 px-6 py-3.5 rounded-2xl shadow-xl text-xs font-semibold text-slate-800 z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none"></div>

    <!-- Leaflet.js Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- User Session Logic -->
    <script>
        const currentUser = JSON.parse(localStorage.getItem('civicgrid_currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('welcomeMessage').innerText = 'Welcome, ' + currentUser.firstName + ' (' + currentUser.emailId + ')!';
            setTimeout(() => {
                const nameInput = document.getElementById('reporterName');
                const aadharInput = document.getElementById('reporterAadhar');
                if(nameInput) nameInput.value = currentUser.firstName + ' ' + (currentUser.lastName || '');
                if(aadharInput) aadharInput.value = currentUser.aadharNumber || '';
            }, 500);
        }

        function signOut() {
            localStorage.removeItem('civicgrid_currentUser');
            window.location.href = 'login.html';
        }

        // View Switcher Styling Updater
        const originalSwitchView = window.switchView;
        function switchView(view) {
            currentView = view;
            document.getElementById('listView').style.display = view === 'list' ? '' : 'none';
            document.getElementById('kanbanView').style.display = view === 'kanban' ? '' : 'none';
            
            const btnList = document.getElementById('btnListView');
            const btnKanban = document.getElementById('btnKanbanView');
            
            if (view === 'list') {
                btnList.className = 'px-5 py-2 rounded-lg transition-all duration-200 bg-brand-500 text-white font-semibold shadow-sm';
                btnKanban.className = 'px-5 py-2 rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900 font-semibold';
            } else {
                btnKanban.className = 'px-5 py-2 rounded-lg transition-all duration-200 bg-brand-500 text-white font-semibold shadow-sm';
                btnList.className = 'px-5 py-2 rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900 font-semibold';
            }
            render();
        }
    </script>

    <!-- Script loads/saves tasks from localStorage -->
    <script src="app.js"></script>
    <script>
        // Initial button active state
        switchView('list');
    </script>
</body>
</html>
