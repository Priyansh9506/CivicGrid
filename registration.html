<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicGrid Civilian Registration - Tailwind CSS</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-8 antialiased">
    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden my-6">
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-500 p-8 text-center text-white">
            <h2 class="text-3xl font-extrabold tracking-tight">CivicGrid</h2>
            <p class="text-orange-100 text-sm font-medium mt-1">Civilian Registration</p>
            <span class="inline-block mt-3 px-3 py-1 bg-white/20 text-white rounded-full text-xs font-semibold backdrop-blur-sm">
                Practical 6 • Tailwind CSS
            </span>
        </div>

        <!-- Form Body -->
        <div class="p-6 sm:p-10 space-y-6">
            <form id="registrationForm" class="space-y-5">
                
                <!-- First Name & Last Name Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="firstName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">First Name</label>
                        <input type="text" id="firstName" placeholder="Enter your first name" required
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition shadow-sm">
                    </div>
                    <div>
                        <label for="lastName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Last Name</label>
                        <input type="text" id="lastName" placeholder="Enter your last name" required
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition shadow-sm">
                    </div>
                </div>

                <!-- Mobile Number & Aadhar Number Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="mobileNumber" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Mobile Number</label>
                        <input type="tel" id="mobileNumber" placeholder="10-digit mobile number" pattern="[0-9]{10}" required
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition shadow-sm">
                        <p class="text-[11px] text-slate-400 mt-1">Format: 10 digit number.</p>
                    </div>
                    <div>
                        <label for="aadharNumber" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Aadhar Card Number</label>
                        <input type="text" id="aadharNumber" placeholder="12-digit Aadhar number" pattern="[0-9]{12}" required
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition shadow-sm">
                        <p class="text-[11px] text-slate-400 mt-1">Format: 12 digit number.</p>
                    </div>
                </div>

                <!-- Email ID & Password Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="emailId" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email ID</label>
                        <input type="email" id="emailId" placeholder="Enter your email address" required
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition shadow-sm">
                    </div>
                    <div>
                        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
                        <input type="password" id="password" placeholder="Create a password" required
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition shadow-sm">
                    </div>
                </div>

                <!-- Address -->
                <div>
                    <label for="address" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Residential Address</label>
                    <textarea id="address" rows="3" placeholder="Enter your residential address" required
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition shadow-sm"></textarea>
                </div>
                
                <button type="submit" 
                    class="w-full py-3.5 px-4 rounded-xl bg-orange-500 text-white font-bold text-sm shadow-lg shadow-orange-500/25 hover:bg-orange-600 active:scale-[0.98] transition mt-2">
                    Register for CivicGrid
                </button>
                
                <div class="text-center text-xs text-slate-500 pt-2 flex flex-col gap-2">
                    <div>
                        Already have an account? 
                        <a href="login.html" class="text-orange-600 font-semibold hover:underline">Sign in here</a>
                    </div>
                    <div>
                        <a href="tailwind_demo.html" class="text-slate-400 hover:text-slate-600 transition">View Tailwind Showcase Page →</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                mobileNumber: document.getElementById('mobileNumber').value,
                aadharNumber: document.getElementById('aadharNumber').value,
                emailId: document.getElementById('emailId').value,
                password: document.getElementById('password').value,
                address: document.getElementById('address').value
            };
            
            let users = JSON.parse(localStorage.getItem('civicgrid_users')) || [];
            
            if (users.find(u => u.emailId === user.emailId)) {
                alert('User with this Email ID already exists!');
                return;
            }
            
            users.push(user);
            localStorage.setItem('civicgrid_users', JSON.stringify(users));

            alert('Registration Successful! Please sign in with your new credentials.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
