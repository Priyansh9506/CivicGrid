<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicGrid Sign In - Tailwind CSS</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-orange-500 to-amber-500 p-8 text-center text-white">
            <h2 class="text-3xl font-extrabold tracking-tight">CivicGrid</h2>
            <p class="text-orange-100 text-sm font-medium mt-1">Sign In to Your Account</p>
            <span class="inline-block mt-3 px-3 py-1 bg-white/20 text-white rounded-full text-xs font-semibold backdrop-blur-sm">
                Practical 6 • Tailwind CSS
            </span>
        </div>

        <!-- Form Body -->
        <div class="p-8 space-y-6">
            <form id="loginForm" class="space-y-5">
                <!-- Email ID -->
                <div>
                    <label for="emailId" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Email ID</label>
                    <input type="email" id="emailId" placeholder="Enter your email address" required
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition shadow-sm placeholder:text-slate-400">
                </div>
                
                <!-- Password -->
                <div>
                    <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition shadow-sm placeholder:text-slate-400">
                </div>
                
                <button type="submit" 
                    class="w-full py-3.5 px-4 rounded-xl bg-orange-500 text-white font-bold text-sm shadow-lg shadow-orange-500/25 hover:bg-orange-600 active:scale-[0.98] transition">
                    Sign In
                </button>
                
                <div class="text-center text-xs text-slate-500 pt-2 flex flex-col gap-2">
                    <div>
                        Don't have an account? 
                        <a href="registration.html" class="text-orange-600 font-semibold hover:underline">Register here</a>
                    </div>
                    <div>
                        <a href="tailwind_demo.html" class="text-slate-400 hover:text-slate-600 transition">View Tailwind Showcase Page →</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailId').value;
            const password = document.getElementById('password').value;
            
            let users = JSON.parse(localStorage.getItem('civicgrid_users')) || [];
            
            const user = users.find(u => u.emailId === email && u.password === password);
            
            if (user) {
                localStorage.setItem('civicgrid_currentUser', JSON.stringify(user));
                alert('Sign In Successful! Welcome back ' + user.firstName + '!');
                window.location.href = 'index.html';
            } else {
                alert('Invalid Email ID or Password. Please try again.');
            }
        });
    </script>
</body>
</html>
