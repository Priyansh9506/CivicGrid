<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Offline Demonstration</title>
    <!-- Bootstrap 5 CSS Offline -->
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="alert alert-info text-center" role="alert">
            <h4 class="alert-heading">Success!</h4>
            <p>This page is successfully using Bootstrap 5 via offline local files.</p>
            <hr>
            <p class="mb-0">You can see the styling applied to this alert box and the button below without needing an internet connection.</p>
        </div>
        <div class="text-center">
            <button class="btn btn-info text-white">Offline Bootstrap Button</button>
        </div>
    </div>

    <!-- Bootstrap 5 JS Offline -->
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
